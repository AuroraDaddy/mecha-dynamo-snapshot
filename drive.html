<h1>🛣 메카 다이너모 — 실도로 주행</h1>
<div class=sub>시드 절차 도로 · 도로좌표(s·o·헤딩오차) 물리 · engine_phys 구동계 · <a href="./">← 홈</a> · <a href="sim.html">엔진 시뮬 →</a></div>

<script src=phys.js></script>
<script>
'use strict';
// ============ 시드 절차 도로 (데스크톱 Road 구조의 웹 이식: 곡률·구배·뱅크·건물·가로수·NPC) ============
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let ROAD=null;
function makeRoad(seed){
 const rnd=mulberry32(seed), N=400, BL=15;                 // 400블록×15m=6km
 const curv=new Float64Array(N),grade=new Float64Array(N),bank=new Float64Array(N);
 let c=0,g=0;
 for(let i=0;i<N;i++){
  if(i%8===0)c=(rnd()*2-1)*0.008*(rnd()<0.3?1.8:1);        // 곡률[1/m]
  if(i%12===0)g=(rnd()*2-1)*0.05;                          // 구배
  curv[i]=c;grade[i]=g;bank[i]=-c*6;}                      // 뱅크=커브 안쪽
 for(let k=0;k<4;k++)for(let i=1;i<N-1;i++){               // 평활
  curv[i]=(curv[i-1]+2*curv[i]+curv[i+1])/4;grade[i]=(grade[i-1]+2*grade[i]+grade[i+1])/4;
  bank[i]=(bank[i-1]+2*bank[i]+bank[i+1])/4}
 const st=5,M=N*BL/st, X=new Float64Array(M),Z=new Float64Array(M),TH=new Float64Array(M),Y=new Float64Array(M);
 let x=0,z=0,th=0,y=0;                                     // 월드 경로 적분(중심선)
 for(let i=0;i<M;i++){X[i]=x;Z[i]=z;TH[i]=th;Y[i]=y;
  const b=Math.min(N-1,(i*st/BL)|0);
  th+=curv[b]*st;x+=Math.cos(th)*st;z+=Math.sin(th)*st;y+=grade[b]*st}
 const lanes=2*(1+((rnd()*2)|0)), width=lanes*3.6;         // 2/4차선(양방향)
 const builds=[],trees=[];
 for(let i=2;i<N-2;i++)for(const sd of [1,-1]){
  const r=rnd();
  if(r<0.34)builds.push({s:i*BL+7.5,o:sd*(width/2+7+rnd()*6),w:8+rnd()*8,d:9+rnd()*5,
   h:6+rnd()*16,c:0.35+rnd()*0.3});
  else if(r<0.55)trees.push({s:i*BL+rnd()*BL,o:sd*(width/2+3.2+rnd()*2),h:4+rnd()*3})}
 const npcs=[]; const lc=width/2/ (lanes/2);               // 차선폭 3.6
 for(let i=0;i<26;i++){const dir=rnd()<0.5?1:-1,ln=(rnd()*lanes/2)|0,
  o=dir*(1.8+3.6*ln)*(1), col=['#c0392b','#dfe4ea','#576574','#f7b731','#2e86de'][ (rnd()*5)|0 ];
  npcs.push({s:60+rnd()*5700,o:dir>0?(1.8+3.6*ln):-(1.8+3.6*ln),dir,v:(9+rnd()*8)*(dir>0?1:1),
   col,br:false,hit:0,spin:0})}
 ROAD={seed,N,BL,curv,grade,bank,X,Z,TH,Y,st,M,lanes,width,builds,trees,npcs}}
function rp(s){const R=ROAD,i=cl(s/R.st,0,R.M-2),i0=i|0,f=i-i0;   // 경로 보간
 return{x:R.X[i0]+(R.X[i0+1]-R.X[i0])*f, z:R.Z[i0]+(R.Z[i0+1]-R.Z[i0])*f,
  th:R.TH[i0]+(R.TH[i0+1]-R.TH[i0])*f, y:R.Y[i0]+(R.Y[i0+1]-R.Y[i0])*f}}
function blk(s){return cl((s/ROAD.BL)|0,0,ROAD.N-1)}
function wpos(s,o){const p=rp(s),bk=ROAD.bank[blk(s)];             // (s,o)->월드(+o=우측)
 return{x:p.x+o*Math.sin(p.th), y:p.y+bk*o, z:p.z-o*Math.cos(p.th), th:p.th}}
// ============ 차량(도로좌표 물리): s·o·헤딩오차 — 데스크톱 road_step/steering_step 구조 ============
const CAR={m:1400,CdA:0.66,Crr:0.012,fd:3.7,td:0.63,eff:0.90,idle:900,L:2.7,mu:1.0};
const V={s:30,o:1.8,he:0,v:0,rpm:900,gear:1,delta:0,thr:0,brk:0,st:0,auto:true,shift:0,
 off:false,crash:0,toast:'',toastT:0,eng:0};
const ENGS=[
 {name:'NA 2.0',cyl:4,bore:86,strk:86,cr:10.5,cam:0.5,octane:95,redline:7200,induction:'NA',boost:1,turbo_size:'Med',gears:6},
 {name:'터보 1.2bar',cyl:4,bore:86,strk:86,cr:9.5,cam:0.5,octane:98,redline:7200,induction:'Turbo',boost:1.2,turbo_size:'Med',gears:6},
 {name:'V8 5.0 NA',cyl:8,bore:94,strk:90,cr:11,cam:0.6,octane:98,redline:7500,induction:'NA',boost:1,turbo_size:'Med',gears:6}];
function EP(){return{...ENGS[V.eng],throttle:V.thr*100,afr:12.8}}
function toast(m){V.toast=m;V.toastT=2.2}
function step(dt){const P=EP(),red=P.redline,vms=V.v/3.6;
 // ---- 조향(속도감응 최대각=그립 한계 atan(μgL/v²) 클램프) + 자기복원 ----
 const dmax=cl(Math.atan(CAR.mu*9.81*CAR.L/Math.max(vms*vms,4)),0.07,0.45);
 const tgt=V.st*dmax; V.delta+=(tgt-V.delta)*Math.min(1,dt*7);
 // ---- 도로좌표 운동학(바이시클): he'=v/L·tanδ−κv · o'=v·sin(he) · s'=v·cos(he) ----
 const kap=ROAD.curv[blk(V.s)];
 V.he+=(vms/CAR.L*Math.tan(V.delta)-kap*vms)*dt;
 V.he=((V.he+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
 V.o+=vms*Math.sin(V.he)*dt; V.s+=vms*Math.cos(V.he)*dt;
 if(V.s>ROAD.N*ROAD.BL-60)V.s=30;                          // 순환
 V.off=Math.abs(V.o)>ROAD.width/2;
 // ---- 자동변속 ----
 if(V.shift>0)V.shift-=dt;
 if(V.auto&&V.shift<=0){
  if(V.rpm>red*0.94&&V.gear<P.gears){V.gear++;V.shift=0.35}
  else if(V.rpm<1500&&V.gear>1&&V.thr>0.2){V.gear--;V.shift=0.35}}
 // ---- 구동(phys.js) + 종방향 힘평형(구배 저항 포함) ----
 const total=gearRatio(P,V.gear)*CAR.fd, wheelRpm=vms/(Math.PI*CAR.td)*60*total;
 const d=driveTorque(P,Math.max(V.rpm,800)), tq=V.shift>0?0:d.tq;
 V.knock=d.cy.knocking;V.boost=d.cy.boost;
 const launch=V.v<8;
 let F;
 if(launch){const tRpm=CAR.idle+red*0.35*V.thr;
  V.rpm+=(tq/0.25*0.10*V.thr-(V.rpm-tRpm)*3)*dt;
  F=cl(tq,0,1e9)*total*CAR.eff/(CAR.td/2)*cl(V.thr*1.6,0,1)}
 else{V.rpm=Math.max(CAR.idle,wheelRpm);F=tq*total*CAR.eff/(CAR.td/2)}
 V.rpm=cl(V.rpm,CAR.idle*0.9,red);
 const mu=V.off?0.55:1.0, drag=0.5*1.205*CAR.CdA*vms*vms,
  rr=(V.v>0.5?CAR.Crr*CAR.m*9.81:0)*(V.off?4:1),
  slope=CAR.m*9.81*Math.sin(ROAD.grade[blk(V.s)]),
  Fb=V.brk*9000*mu;
 F=Math.min(F,mu*CAR.m*9.81*0.9);                          // 구동 그립 한계
 V.v+=(F-drag-rr-Fb-slope)/CAR.m*3.6*dt; if(V.v<0)V.v=0;
 if(V.crash>0)V.crash-=dt;
 if(V.toastT>0)V.toastT-=dt;
 // ---- NPC: 차선 주행 + 선행 감속 + 피격 넉백 ----
 for(const n of ROAD.npcs){
  if(n.hit>0){n.hit-=dt;n.spin+=dt*5;n.s+=n.kv*dt;n.o+=n.ko*dt;n.kv*=0.96;n.ko*=0.96;continue}
  n.br=false;
  let gap=1e9;                                              // 같은 차선 선행(자차 포함)
  for(const m of ROAD.npcs){if(m!==n&&m.dir===n.dir&&Math.abs(m.o-n.o)<1.8){
   const g=(m.s-n.s)*n.dir;if(g>0&&g<gap)gap=g}}
  if(n.dir===1&&Math.abs(V.o-n.o)<1.8){const g=V.s-n.s;if(g>0&&g<gap)gap=g}
  const vt=gap<n.v*1.6?Math.max(0,(gap-6)*0.6):(9+(n.s%7));
  if(vt<n.v-0.3)n.br=true;
  n.v+=(vt-n.v)*dt*0.8; n.s+=n.dir*n.v*dt;
  if(n.s<10)n.s+=ROAD.N*ROAD.BL-80; if(n.s>ROAD.N*ROAD.BL-10)n.s=60;
  // 자차 충돌(차선 겹침 AABB)
  const rel=(n.s-V.s), lat=n.o-V.o;
  if(Math.abs(rel)<4.0&&Math.abs(lat)<1.7&&V.crash<=0){
   const J=CAR.m*vms*0.4;                                   // 운동량 전달(간이 임펄스)
   n.hit=2.5;n.kv=(vms*0.55+2)*(rel>=0?1:-1);n.ko=lat>=0?2.2:-2.2;n.spin=0;
   V.v*=0.35;V.crash=1.0;toast('충돌! NPC 넉백 (J≈'+J.toFixed(0)+' N·s)')}}
 // ---- 건물 충돌(도로 밖) ----
 if(V.off)for(const b of ROAD.builds){
  if(Math.abs(b.s-V.s)<b.d/2+2&&Math.abs(b.o-V.o)<b.w/2+1){
   V.v*=0.15;V.o+=(V.o<b.o?-1.2:1.2);toast('건물 충돌!');break}}}
// ============ 렌더(수제 원근투영 체이스캠·painter) ============
const cv=document.getElementById('cv'),g=cv.getContext('2d'),W=1080,H=680,F=W*0.95;
function draw(){
 const cp=wpos(V.s,V.o), yaw=cp.th+V.he;
 const fx=Math.cos(yaw),fz=Math.sin(yaw),rx=Math.sin(yaw),rz=-Math.cos(yaw);
 const ch=3.1, cb=8.5;                                     // 캠 높이·후방거리
 const cx=cp.x-fx*cb, cyy=cp.y+ch+(V.off?Math.sin(performance.now()*0.05)*0.08*Math.min(V.v/40,1):0), cz=cp.z-fz*cb;
 const pitch=-0.10;
 function prj(p){let dx=p.x-cx,dy=p.y-cyy,dz=p.z-cz;
  const zc=dx*fx+dz*fz, xc=dx*rx+dz*rz, yc=dy+zc*pitch;    // 소각 피치 근사
  if(zc<0.8)return null;
  return{x:W/2+xc*F/zc, y:H*0.46-yc*F/zc, z:zc}}
 // 하늘·지면
 const sky=g.createLinearGradient(0,0,0,H*0.5);
 sky.addColorStop(0,'#5b9bd0');sky.addColorStop(1,'#aacfe8');
 g.fillStyle=sky;g.fillRect(0,0,W,H*0.5);
 g.fillStyle='#5d8f4e';g.fillRect(0,H*0.42,W,H);
 // 도로 리본(원->근)
 const AH=280,DS=4,hw=ROAD.width/2;
 let pl=null,pr=null,pc=[];
 for(let i=AH;i>=-8;i-=DS){const s=V.s+i;
  const L=prj(wpos(s,-hw)),R=prj(wpos(s,hw));
  if(!L||!R){pl=pr=null;continue}
  if(pl&&pr){const fog=cl(i/AH,0,1)*0.55;
   g.fillStyle='#3d4148';g.beginPath();
   g.moveTo(pl.x,pl.y);g.lineTo(pr.x,pr.y);g.lineTo(pr2.x,pr2.y);g.lineTo(pl2.x,pl2.y);g.closePath();g.fill();
   if(fog>0.02){g.fillStyle='rgba(170,207,232,'+fog+')';g.fill()}
   // 차선(중앙 황색 + 백색 파선)
   for(let ln=-ROAD.lanes/2+1;ln<ROAD.lanes/2;ln++){
    const o=ln*3.6, A=prj(wpos(s,o)),B=prj(wpos(s+DS,o));
    if(A&&B&&((s/6)|0)%2===0){g.strokeStyle=ln===0?'#e8c545':'#dfe4ea';
     g.lineWidth=cl(90/A.z,0.6,5);g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke()}}
   // 도로 가장자리 흰선
   g.strokeStyle='#eef1f5';g.lineWidth=cl(70/pl.z,0.5,4);
   g.beginPath();g.moveTo(pl.x,pl.y);g.lineTo(pl2.x,pl2.y);g.stroke();
   g.beginPath();g.moveTo(pr.x,pr.y);g.lineTo(pr2.x,pr2.y);g.stroke()}
  var pl2=L,pr2=R;pl=L;pr=R}
 // 오브젝트 painter(원->근)
 const obj=[];
 for(const b of ROAD.builds){const rel=b.s-V.s;if(rel<-20||rel>AH)continue;obj.push({z:rel,t:'b',b})}
 for(const t of ROAD.trees){const rel=t.s-V.s;if(rel<-15||rel>AH)continue;obj.push({z:rel,t:'t',b:t})}
 for(const n of ROAD.npcs){const rel=n.s-V.s;if(rel<-20||rel>AH)continue;obj.push({z:rel,t:'n',b:n})}
 obj.push({z:0,t:'me'});
 obj.sort((a,b)=>b.z-a.z);
 function box(s,o,th2,w,d,h,col,dark,spin){                // 로컬 정렬 박스(4모서리 기둥)
  const c8=[],co=Math.cos(th2+spin),si=Math.sin(th2+spin);
  for(const[a,b2]of[[-d/2,-w/2],[d/2,-w/2],[d/2,w/2],[-d/2,w/2]]){
   // 도로 프레임에서 (Δs,Δo) 회전
   const ds=a*co-b2*si, dq=a*si+b2*co, q=wpos(s+ds,o+dq);
   const P0=prj({x:q.x,y:q.y,z:q.z}),P1=prj({x:q.x,y:q.y+h,z:q.z});
   if(!P0||!P1)return; c8.push([P0,P1])}
  g.fillStyle=dark;g.beginPath();                          // 측면(단순 2면)
  g.moveTo(c8[0][0].x,c8[0][0].y);g.lineTo(c8[1][0].x,c8[1][0].y);
  g.lineTo(c8[1][1].x,c8[1][1].y);g.lineTo(c8[0][1].x,c8[0][1].y);g.closePath();g.fill();
  g.beginPath();g.moveTo(c8[1][0].x,c8[1][0].y);g.lineTo(c8[2][0].x,c8[2][0].y);
  g.lineTo(c8[2][1].x,c8[2][1].y);g.lineTo(c8[1][1].x,c8[1][1].y);g.closePath();g.fill();
  g.fillStyle=col;g.beginPath();                           // 지붕
  g.moveTo(c8[0][1].x,c8[0][1].y);g.lineTo(c8[1][1].x,c8[1][1].y);
  g.lineTo(c8[2][1].x,c8[2][1].y);g.lineTo(c8[3][1].x,c8[3][1].y);g.closePath();g.fill()}
 for(const ob of obj){
  if(ob.t==='b'){const b=ob.b,sh=(b.c*255)|0;
   box(b.s,b.o,0,b.w,b.d,b.h,'rgb('+(sh+30)+','+(sh+30)+','+(sh+40)+')','rgb('+sh+','+sh+','+(sh+10)+')',0)}
  else if(ob.t==='t'){const t=ob.b,P0=prj(wpos(t.s,t.o)),P1=prj({...wpos(t.s,t.o),y:wpos(t.s,t.o).y+t.h});
   if(!P0||!P1)continue;const sc=cl(160/P0.z,1,42);
   g.strokeStyle='#6b4f35';g.lineWidth=sc*0.22;g.beginPath();g.moveTo(P0.x,P0.y);g.lineTo(P1.x,P1.y);g.stroke();
   g.fillStyle='#3f7d3a';g.beginPath();g.arc(P1.x,P1.y,sc*0.9,0,7);g.fill()}
  else if(ob.t==='n'){const n=ob.b;
   box(n.s,n.o,n.dir>0?0:Math.PI,1.75,4.3,1.42,n.col,'#20242c',n.spin||0);
   if(n.br&&n.dir>0){const bp=prj({...wpos(n.s-2.1,n.o),y:wpos(n.s,n.o).y+0.75});
    if(bp){g.fillStyle='#ff3b30';g.beginPath();g.arc(bp.x-6,bp.y,cl(30/bp.z,1.5,5),0,7);
     g.arc(bp.x+6,bp.y,cl(30/bp.z,1.5,5),0,7);g.fill()}}}
  else{ // 자차(체이스캠)
   box(V.s,V.o,V.he,1.8,4.35,1.35,V.crash>0?'#f87171':'#2f6db3','#1c3a5f',0);
   box(V.s+0.2,V.o,V.he,1.55,2.0,1.75,'#274f7f','#16304f',0)}}
 // HUD
 g.fillStyle='rgba(10,12,16,0.55)';g.fillRect(0,0,W,64);
 g.fillStyle='#fff';g.font='800 44px ui-monospace';g.textAlign='left';
 g.fillText(Math.round(V.v)+' km/h',24,46);
 g.fillStyle='#fbbf24';g.font='800 34px ui-monospace';
 g.fillText(V.shift>0?'⇅':V.gear+'단',330,44);
 g.fillStyle='#9adcf3';g.font='700 26px ui-monospace';
 g.fillText(Math.round(V.rpm)+' rpm',440,44);
 const P=EP();
 if(P.induction!=='NA'){g.fillStyle='#4ade80';g.fillText((V.boost||0).toFixed(2)+' bar',730,44)}
 if(V.knock){g.fillStyle='#f87171';g.font='800 26px -apple-system';g.fillText('⚠KNOCK',930,44)}
 g.textAlign='right';g.fillStyle='#cfd6e2';g.font='600 20px ui-monospace';
 g.fillText('seed '+ROAD.seed+' · '+ROAD.lanes+'차선 · s='+Math.round(V.s)+'m',W-16,H-14);
 if(V.off){g.fillStyle='#fbbf24';g.font='800 30px -apple-system';g.textAlign='center';
  g.fillText('오프로드! (μ 0.55)',W/2,110)}
 if(V.toastT>0){g.fillStyle='#f87171';g.font='800 34px -apple-system';g.textAlign='center';
  g.fillText(V.toast,W/2,160)}}
// ============ 사운드 ============
let AC=null,osc1,osc2,gain;
function soundOn(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
 osc1=AC.createOscillator();osc1.type='sawtooth';osc2=AC.createOscillator();osc2.type='square';
 gain=AC.createGain();gain.gain.value=0;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
 osc1.connect(f);osc2.connect(f);f.connect(gain);gain.connect(AC.destination);osc1.start();osc2.start()}
function soundStep(){if(!AC)return;const fire=V.rpm/60*EP().cyl/2;
 osc1.frequency.setTargetAtTime(fire,AC.currentTime,0.03);
 osc2.frequency.setTargetAtTime(fire*0.5,AC.currentTime,0.03);
 gain.gain.setTargetAtTime(0.03+0.10*V.thr,AC.currentTime,0.05)}
// ============ 입력 ============
const hold=(id,on,off)=>{const e=document.getElementById(id);
 ['touchstart','mousedown'].forEach(ev=>e.addEventListener(ev,x=>{x.preventDefault();on()}));
 ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>e.addEventListener(ev,x=>{x.preventDefault();off()}))};
hold('acc',()=>{V.thr=1;if(AC&&AC.state==='suspended')AC.resume()},()=>V.thr=0);
hold('brk',()=>V.brk=1,()=>V.brk=0);
hold('stL',()=>V.st=-1,()=>{if(V.st<0)V.st=0});
hold('stR',()=>V.st=1,()=>{if(V.st>0)V.st=0});
document.getElementById('bSound').onclick=e=>{soundOn();AC.resume();e.target.classList.toggle('on')};
document.getElementById('bAuto').onclick=e=>{V.auto=!V.auto;e.target.classList.toggle('on')};
document.getElementById('bNew').onclick=()=>{makeRoad((Math.random()*9999)|1);V.s=30;V.o=1.8;V.he=0;V.v=0;V.gear=1};
document.getElementById('bEng').onclick=e=>{V.eng=(V.eng+1)%ENGS.length;e.target.textContent=ENGS[V.eng].name};
// ============ 루프 ============
makeRoad(3);
let tp=performance.now();
(function loop(){const t=performance.now(),dt=Math.min((t-tp)/1000,0.05);tp=t;
 step(dt);soundStep();draw();requestAnimationFrame(loop)})();
</script></body></html>
